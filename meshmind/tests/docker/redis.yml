version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: meshmind-test-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-server --save 60 1000 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-test-data:/data

volumes:
  redis-test-data:
