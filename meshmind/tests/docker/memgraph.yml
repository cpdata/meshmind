version: "3.9"

services:
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: meshmind-test-memgraph
    restart: unless-stopped
    ports:
      - "17687:7687"
      - "13000:3000"
    environment:
      MEMGRAPH_MEMORY_LIMIT: 1GB
    healthcheck:
      test: ["CMD", "bash", "-c", "cypher-shell --version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - memgraph-test-data:/var/lib/memgraph

volumes:
  memgraph-test-data:
